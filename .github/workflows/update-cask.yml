name: Update Homebrew cask

# Manual fallback: sets the Homebrew cask to an already published version.
# Releases normally update the cask themselves (see build.yml).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Published version, for example 1.0.2"
        required: true

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update cask
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
          VERSION: ${{ inputs.version }}
        run: scripts/push-cask.sh "$VERSION"
